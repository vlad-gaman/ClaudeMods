name: Check mod versions

# A change to a mod must bump its version in .claude-plugin/plugin.json, because the version names the release.
on:
  pull_request:
    branches: [main]

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/check-versions.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
